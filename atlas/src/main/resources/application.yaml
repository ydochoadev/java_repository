spring:
  application:
    name: atlas

  datasource:
    url: jdbc:h2:mem:atlasbank
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/atlas_bank

  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
